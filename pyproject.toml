[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prop"
version = "0.1.0"
description = "Learned transport inside CKF track finding"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "polars>=0.20",
]

# onnxruntime is only needed by bench/bench_gtheta_onnx.py, which measures the
# runtime this project does not deploy. Kept out of the default install.
[project.optional-dependencies]
bench = ["onnxruntime", "onnx"]
figures = ["matplotlib"]
# src/prop/baseline_hits.py reads the stock baseline's ROOT output. Nothing
# else here touches ROOT, and the ODD image carries its own uproot, so this is
# only for running that converter on the host.
root = ["uproot", "awkward"]

[tool.setuptools.packages.find]
where = ["src"]
