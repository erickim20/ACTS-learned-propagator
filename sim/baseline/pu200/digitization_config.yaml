# Digitization and the stock CKF. Nothing here is tuned. The CKF writers are
# switched on as well as the ambiguity ones, so the baseline can report the
# track finder on its own and after ambiguity resolution.
campaign: "baseline0"
dataset: "ttbar"
version: "v1"
stage: "digitization"

job_config:
  n_runs: 1
  runs_per_node: 1
  execution_mode: "interactive"

common:
  output_base_dir: "/output"

events: 4
threads: 1
digi: true
reco: true
num_seeds_per_spm: 40

# The production digitization. Without this line digi_and_reco.py falls back to
# the ODD's own odd-digi-smearing-config.json, which is a different and much
# smaller configuration, so the baseline would not be the production one.
# The path is inside the container, where the ColliderML repo is mounted.
digi_config: /workspace/scripts/simulation/odd-full-geo-digi-config.json

output_particles_root: true
output_measurements_root: true

output_parquet_arrow: false

ckf_root_output: true
ckf_finding_performance: true
ckf_fitting_performance: true

ambi_root_output: true
ambi_finding_performance: true
ambi_fitting_performance: true
